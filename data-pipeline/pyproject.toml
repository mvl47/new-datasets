[project]
name = "ffe-pipeline"
version = "0.1.0"
description = "Data pipeline for the FfE Geodata Platform — fetches BKG, MaStR, Destatis, ERA5 and emits artifacts for apps/web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FfE Geodata Platform contributors" }]
dependencies = [
  "click>=8.1",
  "geopandas>=1.0",
  "lxml>=5.3",
  "pyogrio>=0.10",
  "requests>=2.32",
  "shapely>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
era5 = ["cdsapi>=0.7", "xarray>=2024.10", "netcdf4>=1.7"]
dev = [
  "pytest>=8.3",
  "pytest-mock>=3.14",
  "responses>=0.25",
  "ruff>=0.8",
]

[project.scripts]
ffe-pipeline = "ffe_pipeline.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ffe_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
